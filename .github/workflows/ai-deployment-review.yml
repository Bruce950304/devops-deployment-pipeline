
name: Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  automated-review:
    name: Automated PR Review
    runs-on: ubuntu-latest

    steps:
      - name: Check pull request metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const issues = [];
            const title = pr.title || "";
            const body = pr.body || "";

            if (title.length < 10) {
              issues.push("PR title is too short. Use a clear, descriptive title.");
            }

            if (body.trim().length < 30) {
              issues.push("PR description is missing details. Explain the change and how it was tested.");
            }

            if (!/test|check|驗證|測試/i.test(body)) {
              issues.push("Please describe how the changes were tested or verified.");
            }

            const report = [
              "## Automated PR Review",
              "",
              "This report is generated by predefined rules. It is not an AI-generated review.",
              "",
              issues.length
                ? "### Items requiring attention\n" + issues.map(x => "- ⚠️ " + x).join("\n")
                : "### Metadata checks passed\n- PR title and description passed the basic checks.",
              "",
              "### Human review checklist",
              "- [ ] Review the code changes.",
              "- [ ] Confirm tests and security implications.",
              "- [ ] Confirm deployment impact before merging.",
              "",
              "**Safety:** This workflow does not approve PRs or trigger Production deployments."
            ].join("\n");

            const marker = "<!-- automated-pr-review -->";

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });

            const existing = comments.find(c =>
              c.user?.type === "Bot" && c.body?.includes(marker)
            );

            const bodyText = marker + "\n" + report;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: bodyText
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: bodyText
              });
            }

            if (issues.length) {
              core.warning(`Found ${issues.length} PR metadata issue(s).`);
            } else {
              core.info("All PR metadata checks passed.");
            }
